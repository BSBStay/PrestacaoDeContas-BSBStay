services:
  - type: web
    name: bsbstay-shiny
    runtime: docker
    plan: starter                  
    autoDeploy: true
    disk:
      name: bsbstay-data
      mountPath: /data             
      sizeGB: 1                    
    envVars:
      - key: APP_CACHE_DIR
        value: /data/bsbstay       
      - key: APP_MODE
        value: public
      - key: MAX_CACHE_AGE_H
        value: "6"
      - key: DRIVE_FILE_ID
        value: 1fnereY6JOrAbSl1yw_o_U94Fb0KTuHGJU85GEUrCBiU
      - key: DRIVE_FOLDER_ID
        value: 1753AZxwmyyWYS2oYQPLeMHIz5gM8bscb
      - key: BSBSTAY_ADMIN_USER
        value: admin
      - key: BSBSTAY_ADMIN_PASS
        generateValue: true        # Render gera automaticamente; anote no primeiro deploy